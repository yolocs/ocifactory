name: 'ci'

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**/*'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  # go-test runs the full Go test suite, including the live-zot streaming
  # push integration test in pkg/oci/stream_push_integration_test.go.
  # ubuntu-latest (the shared workflow's default) ships with Docker
  # preinstalled and the daemon already running, so testcontainers-go can
  # spin up zot without any extra setup steps here.
  go-test:
    uses: 'abcxyz/pkg/.github/workflows/go-test.yml@main' # ratchet:exclude

  # oidc-e2e proves the auth chain end-to-end against a real OIDC
  # issuer. GitHub Actions mints us an ID token for an audience we
  # pick, ocifactory verifies it against the live GitHub JWKS, and
  # the echo handler (no OCI backend, see pkg/handler/echo) returns
  # the AuthContext so we can confirm the verified subject matched.
  #
  # This catches regressions the unit tests can't: discovery
  # document layout drift at GitHub, JWKS fetch behaviour,
  # signing-algorithm pinning, the entire serve.go wiring path.
  oidc-e2e:
    name: 'oidc-e2e'
    runs-on: 'ubuntu-latest'
    permissions:
      id-token: 'write'
      contents: 'read'
    steps:
      - uses: 'actions/checkout@v4' # ratchet:exclude

      - uses: 'actions/setup-go@v5' # ratchet:exclude
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 'Build ocifactory'
        run: 'go build -o ./bin/ocifactory ./cmd/ocifactory'

      - name: 'Start ocifactory (echo handler)'
        run: |
          mkdir -p ./run
          ./bin/ocifactory serve \
            --repo-type=echo \
            --authn-kind=oidc \
            --authn-oidc-issuers=https://token.actions.githubusercontent.com \
            --authn-oidc-audience=ocifactory-ci \
            --port=8080 \
            > ./run/ocifactory.log 2>&1 &
          echo $! > ./run/ocifactory.pid

      - name: 'Wait for /healthz'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "ocifactory is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "ocifactory did not become healthy in time"
          cat ./run/ocifactory.log
          exit 1

      - name: 'Mint OIDC token (correct audience)'
        id: 'mint_good'
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ocifactory-ci" \
            | jq -r .value)
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "failed to mint token"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: 'Mint OIDC token (wrong audience)'
        id: 'mint_bad_aud'
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=not-ocifactory-ci" \
            | jq -r .value)
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "failed to mint token"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: 'Assert: valid token → 200, body contains expected issuer/sub'
        env:
          TOKEN: '${{ steps.mint_good.outputs.token }}'
        run: |
          set -e
          BODY=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            http://127.0.0.1:8080/whoami)
          echo "body: ${BODY}"
          ISSUER=$(echo "${BODY}" | jq -r '.caller.issuer')
          ID=$(echo "${BODY}" | jq -r '.caller.id')
          if [ "${ISSUER}" != "https://token.actions.githubusercontent.com" ]; then
            echo "wrong issuer in /whoami: got ${ISSUER}"
            exit 1
          fi
          # ID for GHA tokens looks like: repo:owner/repo:ref:refs/heads/main
          # We just assert the prefix to keep this robust to ref changes.
          case "${ID}" in
            repo:${GITHUB_REPOSITORY}:*) ;;
            *) echo "wrong id in /whoami: got ${ID}, want prefix repo:${GITHUB_REPOSITORY}:"
               exit 1 ;;
          esac

      - name: 'Assert: echo route returns the message'
        env:
          TOKEN: '${{ steps.mint_good.outputs.token }}'
        run: |
          set -e
          BODY=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            http://127.0.0.1:8080/echo/hello)
          echo "body: ${BODY}"
          MSG=$(echo "${BODY}" | jq -r '.message')
          if [ "${MSG}" != "hello" ]; then
            echo "wrong echo message: got ${MSG}"
            exit 1
          fi

      - name: 'Assert: missing credential → 401'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/whoami)
          if [ "${STATUS}" != "401" ]; then
            echo "expected 401, got ${STATUS}"
            exit 1
          fi

      - name: 'Assert: garbage token → 401'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer not-a-real-token" \
            http://127.0.0.1:8080/whoami)
          if [ "${STATUS}" != "401" ]; then
            echo "expected 401, got ${STATUS}"
            exit 1
          fi

      - name: 'Assert: wrong audience → 401'
        env:
          TOKEN: '${{ steps.mint_bad_aud.outputs.token }}'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            http://127.0.0.1:8080/whoami)
          if [ "${STATUS}" != "401" ]; then
            echo "expected 401, got ${STATUS}"
            exit 1
          fi

      - name: 'Stop ocifactory'
        if: 'always()'
        run: |
          if [ -f ./run/ocifactory.pid ]; then
            kill "$(cat ./run/ocifactory.pid)" || true
          fi

      - name: 'Dump server log'
        if: 'always()'
        run: |
          if [ -f ./run/ocifactory.log ]; then
            echo "=== ocifactory.log ==="
            cat ./run/ocifactory.log
          fi

  # client-integration runs the per-format real-client tests: pip /
  # twine / mvn / npm driving an ocifactory subprocess against a zot
  # registry started by testcontainers-go.
  #
  # The shared go-test job above runs the same tests but skips them
  # because the runner image doesn't ship pip/twine/mvn. Splitting
  # them into a dedicated job keeps the unit suite fast and isolates
  # the (slower) network-driven cases that need extra tooling.
  client-integration:
    name: 'client-integration'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4' # ratchet:exclude

      - uses: 'actions/setup-go@v5' # ratchet:exclude
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: 'actions/setup-python@v5' # ratchet:exclude
        with:
          python-version: '3.x'

      - uses: 'actions/setup-java@v4' # ratchet:exclude
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: 'actions/setup-node@v4' # ratchet:exclude
        with:
          node-version: '20'

      - name: 'Install twine'
        run: 'python -m pip install --upgrade pip twine'

      - name: 'Install maven'
        run: 'sudo apt-get update && sudo apt-get install -y --no-install-recommends maven'

      - name: 'Run Python client integration test'
        # -tags=integration compiles the integration_test.go files
        # the shared go-test job skips. The -run filter keeps each
        # step focused on one format's real-client test so failures
        # point at the artifact format that broke.
        run: |
          go test -race -count=1 \
            -tags=integration \
            -timeout=10m \
            -v \
            -run '^TestPythonIntegration_RealClients$' \
            ./pkg/handler/python/...

      - name: 'Run Maven client integration test'
        run: |
          go test -race -count=1 \
            -tags=integration \
            -timeout=10m \
            -v \
            -run '^TestMavenIntegration_RealClients$' \
            ./pkg/handler/maven/...

      - name: 'Run npm client integration test'
        run: |
          go test -race -count=1 \
            -tags=integration \
            -timeout=10m \
            -v \
            -run '^TestNpmIntegration_RealClients$' \
            ./pkg/handler/npm/...
