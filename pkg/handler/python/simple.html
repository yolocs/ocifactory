<!DOCTYPE html>
<html>

<head>
  <meta name="pypi:repository-version" content="1.0">
  <title> Links for {{.Title}} </title>
</head>

<body>
  <h1> Links for {{.Title}} </h1>
  {{range $file := .Files}}
  <a href="{{$file.URL}}"
    {{- with $file.RequiresPython}} data-requires-python="{{.}}"{{end}}
    {{- with $file.MetadataSha256}} data-core-metadata="sha256={{.}}" data-dist-info-metadata="sha256={{.}}"{{end -}}
  >{{$file.Filename}}</a><br />
  {{end}}
</body>

</html>
